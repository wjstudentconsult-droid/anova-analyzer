<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANOVA Analyzer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#1e2535;--p:#3b5bdb;--b:#d8deea}
@media(prefers-color-scheme:dark){:root{--bg:#141824;--c:#1e2435;--t:#e6e9f2;--p:#748ffc;--b:#37405a}}
*{box-sizing:border-box}body{margin:0;font-family:Sarabun,Tahoma,sans-serif;background:var(--bg);color:var(--t);padding:16px}
.w{max-width:1100px;margin:auto}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:14px}
h1{margin:0 0 12px;font-size:22px}h2{font-size:16px;margin:0 0 10px;color:var(--p)}h3{font-size:14px;margin:14px 0 6px}
button{font:inherit;border:1px solid var(--b);background:var(--c);color:var(--t);padding:7px 12px;border-radius:8px;cursor:pointer;margin:3px}
button.on,button.pr{background:var(--p);color:#fff;border-color:var(--p)}button.dg{border-color:#e03131;color:#e03131}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}select{width:100%;min-height:110px;background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:8px}
.tb{overflow-x:auto}table{border-collapse:collapse;font-size:13px;min-width:60%}th,td{border:1px solid var(--b);padding:4px 8px;text-align:right}th{background:rgba(120,140,200,.18)}td:first-child,th:first-child{text-align:left}
.hint{font-size:13px;opacity:.8;margin:6px 0}.err{color:#e03131;font-weight:600}li{margin:3px 0;font-size:14px}
.ch{max-width:720px}.cd{font-size:13px;opacity:.85;margin-top:6px}
</style></head><body><div class="w">
<h1>📊 <span class="l" data-th="เครื่องมือวิเคราะห์สถิติตระกูล ANOVA" data-en="ANOVA-Family Statistical Toolkit"></span></h1>
<div class="card"><h2>1. <span class="l" data-th="เลือกประเภทการวิเคราะห์" data-en="Select analysis"></span></h2><div id="ms"></div><div class="hint" id="mh"></div></div>
<div class="card"><h2>2. <span class="l" data-th="แนบไฟล์ข้อมูล Excel / CSV" data-en="Upload Excel / CSV data"></span></h2>
<input type="file" id="fi" accept=".xlsx,.xls,.csv"> <button id="sb"><span class="l" data-th="ใช้ข้อมูลตัวอย่าง" data-en="Use sample data"></span></button>
<div class="hint" id="di"></div>
<div class="g"><div><b class="l" data-th="ตัวแปรตาม (DV)" data-en="Dependent (DV)"></b><select id="sDV" multiple></select></div>
<div><b class="l" data-th="ตัวแปรกลุ่ม (Factor)" data-en="Factor(s)"></b><select id="sF" multiple></select></div>
<div><b class="l" data-th="ตัวแปรร่วม (Covariate)" data-en="Covariate(s)"></b><select id="sC" multiple></select></div></div>
<div class="hint l" data-th="กด Ctrl/Cmd ค้างเพื่อเลือกหลายตัวแปร" data-en="Hold Ctrl/Cmd to select multiple variables"></div></div>
<div class="card"><h2>3. <span class="l" data-th="ภาษาที่แสดงผล" data-en="Output language"></span></h2><button id="lt" class="on">ไทย</button><button id="le">English</button>
<hr style="border:0;border-top:1px solid var(--b)"><button class="pr" id="run">▶ <span class="l" data-th="ประมวลผล" data-en="Run analysis"></span></button><button class="dg" id="rs">↺ Reset</button></div>
<div id="out"></div></div>
<script>
let lang='th',DATA=null,sample=false,method='oneway',LAST=null,charts=[];
const T=(a,b)=>lang=='th'?a:b,$=id=>document.getElementById(id);
const sum=a=>a.reduce((s,v)=>s+v,0),mean=a=>sum(a)/a.length,sd=a=>a.length>1?Math.sqrt(sum(a.map(v=>(v-mean(a))**2))/(a.length-1)):0;
const f=(x,d=3)=>isFinite(x)?(+x).toFixed(d):'-',pf=p=>p<.001?'<.001':f(p);
// ---- distributions
function lg(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const v of c)s+=v/++y;return -t+Math.log(2.5066282746310005*s/x)}
function bcf(a,b,x){const q=a+b,qp=a+1,qm=a-1,tn=1e-30;let c=1,d=1-q*x/qp;if(Math.abs(d)<tn)d=tn;d=1/d;let h=d;for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qm+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<tn)d=tn;c=1+aa/c;if(Math.abs(c)<tn)c=tn;d=1/d;h*=d*c;aa=-(a+m)*(q+m)*x/((a+m2)*(qp+m2));d=1+aa*d;if(Math.abs(d)<tn)d=tn;c=1+aa/c;if(Math.abs(c)<tn)c=tn;d=1/d;const dl=d*c;h*=dl;if(Math.abs(dl-1)<3e-12)break}return h}
function ib(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lg(a+b)-lg(a)-lg(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*bcf(a,b,x)/a:1-bt*bcf(b,a,1-x)/b}
const pF=(F,d1,d2)=>F<=0||!isFinite(F)?1:ib(d2/(d2+d1*F),d2/2,d1/2),pT=(t,d)=>ib(d/(d+t*t),d/2,.5);
const tq=df=>{let lo=0,hi=200;for(let i=0;i<60;i++){const m=(lo+hi)/2;pT(m,df)>.05?lo=m:hi=m}return lo};
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))}
const nq=p=>{let lo=-8,hi=8;for(let i=0;i<40;i++){const m=(lo+hi)/2;.5*(1+erf(m/Math.SQRT2))<p?lo=m:hi=m}return lo};
// ---- matrices
const mm=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,v,k)=>s+v*B[k][j],0))),tr=A=>A[0].map((_,j)=>A.map(r=>r[j]));
function inv(A){const n=A.length,M=A.map((r,i)=>[...r,...Array.from({length:n},(_,j)=>+(i==j))]);for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;[M[i],M[p]]=[M[p],M[i]];const d=M[i][i];if(Math.abs(d)<1e-10)return null;for(let j=0;j<2*n;j++)M[i][j]/=d;for(let r=0;r<n;r++)if(r!=i){const k=M[r][i];if(k)for(let j=0;j<2*n;j++)M[r][j]-=k*M[i][j]}}return M.map(r=>r.slice(n))}
function det(A){const n=A.length,M=A.map(r=>[...r]);let d=1;for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;if(!M[p][i])return 0;if(p!=i){[M[i],M[p]]=[M[p],M[i]];d=-d}d*=M[i][i];for(let r=i+1;r<n;r++){const k=M[r][i]/M[i][i];for(let j=i;j<n;j++)M[r][j]-=k*M[i][j]}}return d}
// ---- GLM (Type III SS via effect coding)
function fit(Y,X){const Xt=tr(X),A=inv(mm(Xt,X));if(!A)return null;const B=mm(A,mm(Xt,Y)),ft=mm(X,B),res=Y.map((r,i)=>r.map((v,j)=>v-ft[i][j]));return{E:mm(tr(res),res),fit:ft,res}}
function design(rows,fa,co){const one=rows.map(()=>1),fc={};fa.forEach(a=>{const lv=[...new Set(rows.map(r=>r[a]))].sort(),last=lv.at(-1);fc[a]=lv.slice(0,-1).map(l=>rows.map(r=>r[a]==l?1:r[a]==last?-1:0))});
const subs=[];for(let m=1;m<(1<<fa.length);m++)subs.push(fa.filter((_,i)=>m>>i&1));subs.sort((a,b)=>a.length-b.length);const terms=[];
subs.forEach(s=>{let cs=[one];s.forEach(a=>{const n=[];cs.forEach(c=>fc[a].forEach(g=>n.push(c.map((v,i)=>v*g[i]))));cs=n});terms.push({name:s.join('×'),cols:cs.slice()})});
co.forEach(c=>{const m=mean(rows.map(r=>r[c]));terms.push({name:c,cols:[rows.map(r=>r[c]-m)]})});return{i:one,terms}}
function glm(rows,dv,fa,co){const D=design(rows,fa,co),n=rows.length,Y=rows.map(r=>dv.map(d=>r[d]));
const bd=ex=>tr([D.i,...D.terms.filter(t=>t!==ex).flatMap(t=>t.cols)]),X=bd(null),F=fit(Y,X);if(!F)return null;const dfe=n-X[0].length;if(dfe<1)return null;
const o={n,dfe,dfm:X[0].length-1,E:F.E,fit:F.fit,res:F.res,terms:[]};
for(const t of D.terms){const R=fit(Y,bd(t));if(!R)return null;o.terms.push({name:t.name,df:t.cols.length,H:R.E.map((r,i)=>r.map((v,j)=>v-F.E[i][j]))})}return o}
function owF(g){const N=sum(g.map(a=>a.length)),k=g.length,gm=mean(g.flat());let b=0,w=0;g.forEach(a=>{const m=mean(a);b+=a.length*(m-gm)**2;a.forEach(v=>w+=(v-m)**2)});const d1=k-1,d2=N-k,F=(b/d1)/(w/d2);return{F,d1,d2,p:pF(F,d1,d2)}}
const grp=(rows,fa)=>{const m=new Map();rows.forEach(r=>{const k=fa.map(a=>r[a]).join(' | ');(m.get(k)||m.set(k,[]).get(k)).push(r)});return new Map([...m].sort((a,b)=>a[0]<b[0]?-1:1))};
const eff=e=>e>=.14?T('ขนาดใหญ่','large'):e>=.06?T('ขนาดปานกลาง','medium'):e>=.01?T('ขนาดเล็ก','small'):T('เล็กน้อยมาก','negligible');
const say=(nm,F,a,b,p,e)=>`<b>${nm}</b>: F(${f(a,0)}, ${f(b,0)}) = ${f(F)}, p = ${pf(p)}, η²p = ${f(e)} → `+(p<.05?T(`มีนัยสำคัญทางสถิติที่ระดับ .05 (ขนาดอิทธิพล${eff(e)})`,`statistically significant at .05 (${eff(e)} effect)`):T('ไม่มีนัยสำคัญทางสถิติที่ระดับ .05','not significant at .05'));
const ZH=()=>[T('แหล่งความแปรปรวน','Source'),'SS','df','MS','F','p','η²p'];
// ---- methods
const M={oneway:['One-Way ANOVA','เลือก DV 1 ตัว, Factor 1 ตัว','Select 1 DV, 1 factor',[1,1,1,1,0,0]],
welch:['Welch ANOVA','เลือก DV 1 ตัว, Factor 1 ตัว (ไม่ต้องสมมติความเท่ากันของความแปรปรวน)','1 DV, 1 factor (unequal variances)',[1,1,1,1,0,0]],
twoway:['Two-Way ANOVA','DV 1 ตัว, Factor 2 ตัว (รวมปฏิสัมพันธ์)','1 DV, 2 factors (with interaction)',[1,1,2,2,0,0]],
nway:['Factorial / Three-Way ANOVA','DV 1 ตัว, Factor 3 ตัวขึ้นไป','1 DV, 3+ factors',[1,1,3,5,0,0]],
ancova:['ANCOVA','DV 1 ตัว, Factor ≥1, Covariate ≥1','1 DV, ≥1 factor, ≥1 covariate',[1,1,1,5,1,5]],
rm:['Repeated Measures ANOVA','เลือก DV หลายคอลัมน์ = การวัดซ้ำแต่ละครั้ง (ข้อมูลแบบ wide)','Select several DV columns = each repeated measure (wide format)',[2,20,0,0,0,0]],
manova:['MANOVA','DV ≥2, Factor ≥1','≥2 DVs, ≥1 factor',[2,9,1,5,0,0]],
mancova:['MANCOVA','DV ≥2, Factor ≥1, Covariate ≥1','≥2 DVs, ≥1 factor, ≥1 covariate',[2,9,1,5,1,5]]};
function drawM(){$('ms').innerHTML=Object.keys(M).map(k=>`<button data-m="${k}" class="${k==method?'on':''}">${M[k][0]}</button>`).join('');$('mh').textContent=T(M[method][1],M[method][2]);
$('ms').querySelectorAll('button').forEach(b=>b.onclick=()=>{method=b.dataset.m;drawM();defSel()})}
function setLang(l){lang=l;document.documentElement.lang=l;document.querySelectorAll('.l').forEach(e=>e.textContent=e.dataset[l]);$('lt').classList.toggle('on',l=='th');$('le').classList.toggle('on',l=='en');drawM();showInfo();if(LAST)run()}
// ---- data
function showInfo(){$('di').textContent=DATA?T(`โหลดข้อมูลแล้ว ${DATA.rows.length} แถว, ${DATA.cols.length} คอลัมน์: `,`Loaded ${DATA.rows.length} rows, ${DATA.cols.length} columns: `)+DATA.cols.join(', '):T('ยังไม่ได้โหลดข้อมูล (แถวแรกคือชื่อตัวแปร)','No data loaded (first row = variable names)')}
function setData(rows,s){DATA={rows,cols:Object.keys(rows[0]||{})};sample=s;['sDV','sF','sC'].forEach(i=>$(i).innerHTML=DATA.cols.map(c=>`<option>${c}</option>`).join(''));showInfo();defSel()}
function defSel(){if(!sample||!DATA)return;const d={oneway:[['Score1'],['Group'],[]],welch:[['Score1'],['Group'],[]],twoway:[['Score1'],['Group','Gender'],[]],nway:[['Score1'],['Group','Gender','Class'],[]],ancova:[['Score1'],['Group'],['Pretest']],rm:[['Score1','Score2','Score3'],[],[]],manova:[['Score1','Score2'],['Group'],[]],mancova:[['Score1','Score2'],['Group'],['Pretest']]}[method];['sDV','sF','sC'].forEach((id,i)=>[...$(id).options].forEach(o=>o.selected=d[i].includes(o.value)))}
$('fi').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array'});setData(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}),false)}catch(x){$('di').innerHTML='<span class=err>'+x.message+'</span>'}};r.readAsArrayBuffer(fl)};
$('sb').onclick=()=>{let s=12345;const u=()=>(s=(s*16807)%2147483647)/2147483647,nr=()=>Math.sqrt(-2*Math.log(u()))*Math.cos(6.2832*u()),rows=[];
for(let i=0;i<60;i++){const g=i%3,fm=i%2,pre=50+8*nr(),s1=20+.5*pre+[0,4,8][g]+2*fm+((i>>1)%2?1.5:0)+4*nr(),s2=s1+3+[0,2,5][g]+2*nr(),s3=s2+2+2*nr();rows.push({Group:'ABC'[g],Gender:fm?'F':'M',Class:(i>>1)%2?'X':'Y',Pretest:+pre.toFixed(1),Score1:+s1.toFixed(1),Score2:+s2.toFixed(1),Score3:+s3.toFixed(1)})}setData(rows,true)};
const sel=id=>[...$(id).selectedOptions].map(o=>o.value);
// ---- analysis
function run(){try{LAST=1;destroy();const o=analyze();render(o)}catch(x){$('out').innerHTML='<div class="card err">'+x.message+'</div>'}}
function analyze(){if(!DATA)throw Error(T('กรุณาแนบไฟล์หรือใช้ข้อมูลตัวอย่างก่อน','Please upload a file or use sample data first'));
const dv=sel('sDV'),fa=sel('sF'),co=sel('sC'),r=M[method][3],ns=[dv,fa,co];
for(let i=0;i<3;i++)if(ns[i].length<r[2*i]||ns[i].length>r[2*i+1])throw Error(T('การเลือกตัวแปรไม่ตรงกับวิธีที่เลือก: ','Variable selection does not match method: ')+T(M[method][1],M[method][2]));
if(new Set([...dv,...fa,...co]).size<dv.length+fa.length+co.length)throw Error(T('ห้ามเลือกตัวแปรซ้ำกันในหลายช่อง','A variable cannot be in more than one box'));
const rows=DATA.rows.map(w=>{const o={};for(const c of [...dv,...co]){const v=w[c];if(v===''||v==null||!isFinite(+v))return null;o[c]=+v}for(const c of fa){if(w[c]===''||w[c]==null)return null;o[c]=String(w[c])}return o}).filter(Boolean);
if(rows.length<4)throw Error(T('ข้อมูลที่ใช้ได้น้อยเกินไป','Too few valid rows'));
const o={tables:[],notes:[],charts:[]},tt=(t,head,rw)=>o.tables.push({t,head,rows:rw}),pm=(a,b)=>{const m=[];a.forEach((x,i)=>a.forEach((y,j)=>i<j&&m.push([x,y])));return m};
o.notes.push(T(`ใช้ข้อมูลที่สมบูรณ์ ${rows.length} จาก ${DATA.rows.length} แถว`,`Used ${rows.length} of ${DATA.rows.length} complete rows`));
if(method=='rm')return rmRun(rows,dv,o,tt);
if(method=='welch')return welchRun(rows,dv[0],fa[0],o,tt);
const G=glm(rows,dv,fa,co);if(!G)throw Error(T('คำนวณไม่ได้ (ข้อมูลอาจมีเซลล์ว่าง/ตัวแปรสัมพันธ์กันสมบูรณ์/จำนวนข้อมูลน้อยไป)','Cannot compute (empty cells, collinearity or too little data)'));
const cells=grp(rows,fa),ck=[...cells.keys()],t95=g=>tq(g.length-1)*sd(g)/Math.sqrt(g.length);
// descriptives
const dr=[];cells.forEach((g,k)=>dv.forEach(d=>{const v=g.map(r=>r[d]);dr.push([k,d,v.length,f(mean(v)),f(sd(v)),f(mean(v)-t95(v)),f(mean(v)+t95(v))])}));
tt(T('สถิติเชิงพรรณนา (ค่าเฉลี่ย, ส่วนเบี่ยงเบนมาตรฐาน, ช่วงเชื่อมั่น 95%)','Descriptive statistics (mean, SD, 95% CI)'),[T('กลุ่ม','Group'),'DV','n','Mean','SD','CI low','CI high'],dr);
o.notes.push(T('ตารางพรรณนาแสดงค่าเฉลี่ยของแต่ละกลุ่ม (เซลล์) ใช้เปรียบเทียบภาพรวมก่อนดูการทดสอบนัยสำคัญ','Descriptives summarise each group/cell; inspect them before the significance tests.'));
// Levene
const lv=dv.map(d=>{const g=[...cells.values()].map(a=>{const v=a.map(r=>r[d]),m=mean(v);return v.map(x=>Math.abs(x-m))});const q=owF(g);return[d,f(q.F),q.d1,q.d2,pf(q.p),q.p<.05?T('ความแปรปรวนไม่เท่ากัน','unequal variances'):T('ความแปรปรวนเท่ากัน','equal variances')]});
tt(T('การทดสอบ Levene (ความเท่ากันของความแปรปรวน)','Levene test (homogeneity of variance)'),['DV','F','df1','df2','p',T('สรุป','Conclusion')],lv);
o.notes.push(T('Levene: ถ้า p > .05 แสดงว่าสมมติฐานความแปรปรวนเท่ากันเป็นจริง หากไม่เป็นจริงควรระมัดระวังการตีความ (หรือใช้ Welch ANOVA)','Levene: p > .05 supports equal variances; otherwise interpret with caution (or use Welch ANOVA).'));
// ANOVA per DV
const MSE=[],ETA=[];dv.forEach((d,j)=>{const y=rows.map(r=>r[d]),sst=sum(y.map(v=>(v-mean(y))**2)),sse=G.E[j][j],mse=sse/G.dfe;MSE.push(mse);const R=[],ssm=sst-sse,Fm=(ssm/G.dfm)/mse;
R.push([T('โมเดลที่ปรับแล้ว','Corrected Model'),f(ssm),G.dfm,f(ssm/G.dfm),f(Fm),pf(pF(Fm,G.dfm,G.dfe)),f(ssm/sst)]);const et=[];
G.terms.forEach(t=>{const ss=t.H[j][j],F=ss/t.df/mse,p=pF(F,t.df,G.dfe),e=ss/(ss+sse);et.push(e);R.push([t.name,f(ss),t.df,f(ss/t.df),f(F),pf(p),f(e)]);o.notes.push(`[${d}] `+say(t.name,F,t.df,G.dfe,p,e))});
R.push([T('ความคลาดเคลื่อน','Error'),f(sse),G.dfe,f(mse),'','','']);R.push([T('รวม (ปรับแล้ว)','Corrected Total'),f(sst),rows.length-1,'','','','']);ETA.push(et);
